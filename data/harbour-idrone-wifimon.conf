<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The root helper owns the name and broadcasts decoded Remote-ID packs. -->
  <policy user="root">
    <allow own="org.idrone.WifiMonitor"/>
    <allow send_interface="org.idrone.WifiMonitor"/>
  </policy>
  <!-- The app (defaultuser) may receive those broadcast signals. Receive-only. -->
  <policy user="defaultuser">
    <allow receive_sender="org.idrone.WifiMonitor"/>
    <allow receive_interface="org.idrone.WifiMonitor"/>
  </policy>
</busconfig>
